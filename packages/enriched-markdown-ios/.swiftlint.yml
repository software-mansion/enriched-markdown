# SwiftLint lints everything under the working directory; exclude RaTeX's
# upstream sources (vendored byte-identical for diffable re-pins) and the
# SwiftPM-generated code in .build (e.g. resource-bundle accessors).
excluded:
  - Sources/EnrichedMarkdownLaTeX/Vendor
  - .build

# Size thresholds are raised above the defaults where renderer dispatch code
# (element switches, HTML generation) legitimately exceeds them; the test tree
# relaxes size rules further in Tests/.swiftlint.yml.
cyclomatic_complexity:
  ignores_case_statements: true

file_length:
  warning: 600

function_body_length:
  warning: 100
  error: 150

function_parameter_count:
  warning: 6

line_length: 150

type_body_length:
  warning: 500
  error: 650

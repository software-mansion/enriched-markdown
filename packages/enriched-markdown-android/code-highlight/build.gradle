plugins {
  id "com.android.library"
  id "org.jetbrains.kotlin.plugin.compose"
}

// The tree-sitter runtime, grammars and generated registry are gitignored and restored by the
// vendor script, which writes grammars/.stamp once every grammar is in place. Fail before the
// build with the fix rather than deep inside CMake with a missing source. A task rather than a
// configuration-time check, so builds that never compile this module (the benchmarks, :ui's
// tests) run without the vendored sources.
def highlightVendorStamp = file("../../core/cpp/highlight/vendor/grammars/.stamp")
def checkHighlightVendor = tasks.register("checkHighlightVendor") {
  doLast {
    if (!highlightVendorStamp.exists()) {
      throw new GradleException(
        "[code-highlight] tree-sitter grammar sources are missing (${highlightVendorStamp.path} not found). " +
          "From the repository root run: yarn install && node vendor/vendor-grammars.mjs"
      )
    }
  }
}
tasks.named("preBuild") { dependsOn(checkHighlightVendor) }

android {
  namespace = "com.swmansion.enriched.markdown.codehighlight"

  compileSdk = rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdk = rootProject.ext.minSdkVersion
    consumerProguardFiles("consumer-rules.pro")
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

    externalNativeBuild {
      cmake {
        cppFlags("-std=c++17")
        arguments("-DANDROID_STL=c++_shared")
      }
    }

    ndk {
      abiFilters("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
    }
  }

  packaging {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
  }

  externalNativeBuild {
    cmake {
      path = file("src/main/cpp/CMakeLists.txt")
    }
  }

  ndkVersion = rootProject.ext.ndkVersion
}

dependencies {
  api(project(":ui"))

  def composeBom = platform("androidx.compose:compose-bom:2026.06.00")

  // The Compose style DSL (`markdownStyle { codeHighlight { ... } }`) ships as extension
  // functions on :compose types and the `CodeHighlightPlugin { ... }` scope as a composable,
  // but highlighting itself goes through the View API alone. compileOnly keeps Compose out of the
  // published POM, as for math.
  compileOnly(project(":compose"))
  compileOnly(composeBom)
  compileOnly("androidx.compose.ui:ui")
  compileOnly("androidx.compose.runtime:runtime")

  testImplementation(project(":compose"))
  testImplementation(composeBom)
  testImplementation("androidx.compose.ui:ui")
  testImplementation("androidx.compose.ui:ui-test-junit4")
  testImplementation("junit:junit:4.13.2")
  testImplementation("androidx.test:core:1.6.1")
  testImplementation("androidx.test.ext:junit:1.2.1")
  testImplementation("org.robolectric:robolectric:4.14.1")

  // The Compose compiler runs on every source set, so the instrumented tests need the runtime too.
  androidTestImplementation(composeBom)
  androidTestImplementation("androidx.compose.runtime:runtime")
  androidTestImplementation("junit:junit:4.13.2")
  androidTestImplementation("androidx.test:core:1.6.1")
  androidTestImplementation("androidx.test.ext:junit:1.2.1")
  androidTestImplementation("androidx.test:runner:1.6.2")
}

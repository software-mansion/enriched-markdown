buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['EnrichedMarkdown_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["EnrichedMarkdown_" + name]).toInteger()
}

def enableMath = (rootProject.findProperty("enrichedMarkdown.enableMath") ?: findProperty("enrichedMarkdown.enableMath") ?: "true").toString().toBoolean()

// Curated default grammar set; keep in sync with vendor/grammar-versions.json
// (default:true) and the C++ canonicalGrammarId table.
def defaultCodeHighlightLanguages = ["json", "html", "css", "markdown", "yaml", "go", "java", "javascript", "python", "c", "rust", "bash"]
def enableCodeHighlight = (rootProject.findProperty("enrichedMarkdown.enableCodeHighlight") ?: findProperty("enrichedMarkdown.enableCodeHighlight") ?: "true").toString().toBoolean()
def codeHighlightLanguagesProp = rootProject.findProperty("enrichedMarkdown.codeHighlightLanguages") ?: findProperty("enrichedMarkdown.codeHighlightLanguages")
def codeHighlightLanguages = codeHighlightLanguagesProp ? codeHighlightLanguagesProp.toString().split(",").collect { it.trim() }.findAll { it } : defaultCodeHighlightLanguages
def codeHighlightActive = enableCodeHighlight && !codeHighlightLanguages.isEmpty()

android {
  namespace "com.swmansion.enriched.markdown"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
    buildConfigField "boolean", "ENABLE_MATH", "${enableMath}"
    buildConfigField "boolean", "ENABLE_CODE_HIGHLIGHT", "${codeHighlightActive}"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
      if (enableMath) {
        java.srcDirs += ["src/math/java"]
      }
    }
  }
}

// Code-block syntax highlighting (tree-sitter) native wiring. This module owns
// no externalNativeBuild block: RN autolinking compiles src/main/jni/CMakeLists.txt
// as part of the consumer app's native build, so the app -- not this library --
// owns the CMake arguments. The enable flag + selected grammars therefore reach
// CMake through a config file written here during configuration (before any
// native build task runs) and include()d by CMakeLists.txt.
def highlightConfigDir = new File(projectDir, "build/generated/highlight")
highlightConfigDir.mkdirs()
def highlightConfigFile = new File(highlightConfigDir, "highlight-config.cmake")
if (codeHighlightActive) {
  def vendorDir = new File(projectDir, "../cpp/highlight/vendor").canonicalPath
  def committedGenerated = new File(vendorDir, "generated")
  def generatedDir
  if (codeHighlightLanguages.toSorted() == defaultCodeHighlightLanguages.toSorted() && committedGenerated.exists()) {
    // Common case: the committed default-set registry ships in-tree, no codegen.
    generatedDir = committedGenerated
  } else {
    // Custom language set: regenerate the registry from the vendored .scm files.
    generatedDir = new File(highlightConfigDir, "generated")
    generatedDir.mkdirs()
    def genScript = [
      new File(projectDir, "../../../vendor/gen-registry.mjs"),
      new File(projectDir, "../cpp/highlight/gen-registry.mjs"),
    ].find { it.exists() }
    if (genScript == null) {
      throw new GradleException("enrichedMarkdown.codeHighlightLanguages is customized but vendor/gen-registry.mjs was not found. Use the default language set or build from the monorepo.")
    }
    exec {
      commandLine "node", genScript.canonicalPath, "--vendor-dir", vendorDir, "--languages", codeHighlightLanguages.join(","), "--out", generatedDir.canonicalPath
    }
  }
  highlightConfigFile.text = """\
set(ENRICHED_MARKDOWN_CODE_HIGHLIGHT ON)
set(ENRICHED_MARKDOWN_HIGHLIGHT_LANGUAGES "${codeHighlightLanguages.join(';')}")
set(ENRICHED_MARKDOWN_HIGHLIGHT_GENERATED_DIR "${generatedDir.canonicalPath}")
"""
} else {
  highlightConfigFile.text = "set(ENRICHED_MARKDOWN_CODE_HIGHLIGHT OFF)\n"
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // Baseline Profile installer for AOT compilation hints
  implementation "androidx.profileinstaller:profileinstaller:1.3.1"
  // LaTeX math rendering (optional — set enrichedMarkdown.enableMath=false in gradle.properties to exclude)
  if (enableMath) {
    implementation("io.github.erweixin:ratex-android:0.1.10")
  }
}

react {
  jsRootDir = file("../src/")
  libraryName = "EnrichedMarkdownText"
  codegenJavaPackageName = "com.swmansion.enriched.markdown"
}

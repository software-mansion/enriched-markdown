# Streams the Renderers scenario document and proves the replaced blocks land
# where the native layout reserved space for them. Structural checks name the
# slots the screen must show; the script reads the accessibility tree and fails
# on any text frame intersecting a card or any partial media syntax on screen.
#
#   argent flow run qa-renderers-streaming --platform ios --device <udid>
#   argent flow run qa-renderers-streaming --platform android --device <serial>
steps:
  - echo: Launch the example app; expect Home
  - launch: { native: swmansion.enriched.markdown.example }
  - await: { visible: { id: home-block-renderers } }
  - await: { idle: true }
  - echo: Open Renderers
  - tap: { id: home-block-renderers }
  - await: { visible: { id: renderers-screen } }
  - await: { idle: true }
  - assert: { visible: { id: renderer-image-root-0 } }
  - echo: Stream the document and wait for it to finish
  - tap: { id: stream-button }
  - await: { text: { in: { id: stream-button }, contains: Streaming } }
  - await: { text: { in: { id: stream-button }, equals: Stream the document }, timeout: 30000 }
  - await: { idle: true }
  - echo: The hero block is back after the stream
  - assert: { visible: { id: renderer-image-root-0 } }
  - script: { path: ../../scripts/qa/check-block-slots.mjs }
  - echo: Scroll to the quoted figures and check again
  - scroll-to: { target: { id: renderer-image-blockquote-0 } }
  - await: { visible: { id: renderer-image-blockquote-0 } }
  - await: { idle: true }
  - script: { path: ../../scripts/qa/check-block-slots.mjs }
  - echo: Scroll to the videos and check once more
  - scroll-to: { target: { id: renderer-video-root-1 } }
  - await: { visible: { id: renderer-video-root-1 } }
  - await: { idle: true }
  - script: { path: ../../scripts/qa/check-block-slots.mjs }

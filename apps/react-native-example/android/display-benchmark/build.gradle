buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // AOT-compiles the test APK before running, as microbenchmarks require.
    classpath "androidx.benchmark:benchmark-gradle-plugin:1.5.0"
  }
}

apply plugin: "com.android.library"
// Same rule as the library's build.gradle: AGP 9 applies Kotlin itself unless
// android.builtInKotlin=false, and applying it twice fails configuration.
def shouldApplyKotlinPlugin() {
  def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajor <= 8) {
    return true
  }
  if (agpMajor >= 10) {
    return false
  }
  def propertyVal = providers.gradleProperty("android.builtInKotlin").orNull
  def builtInKotlinEnabled = propertyVal != null ? propertyVal.toBoolean() : true
  return !builtInKotlinEnabled
}
if (shouldApplyKotlinPlugin()) {
  apply plugin: "kotlin-android"
}
apply plugin: "androidx.benchmark"

// The fixtures are the ones the enriched-markdown-android display benchmark runs, read
// in place so both benchmarks always measure identical inputs.
def sharedFixtures = new File(rootDir, "../../../packages/enriched-markdown-android/display-benchmark/src/androidTest/assets")

android {
  namespace = "com.swmansion.enriched.markdown.benchmark"

  compileSdk = rootProject.ext.compileSdkVersion
  ndkVersion = rootProject.ext.ndkVersion

  defaultConfig {
    // The harness records a frame into a RenderNode; see DisplayBenchmark.
    minSdk = 29
    testInstrumentationRunner = "androidx.benchmark.junit4.AndroidBenchmarkRunner"
    // A thermal-throttle cool-down inside measureRepeatedOnMainThread counts against
    // its 10 s deadline and fails the test; the benchmark still yields to the main thread.
    testInstrumentationRunnerArguments["androidx.benchmark.measureRepeatedOnMainThread.throwOnDeadline"] = "false"

    ndk {
      abiFilters(*(findProperty("reactNativeArchitectures") ?: "arm64-v8a").toString().split(","))
    }
  }

  // Benchmarks must run non-debuggable.
  testBuildType = "release"

  buildTypes {
    release {
      // R8, as in the enriched-markdown-android benchmark, so the two libraries are
      // compared under the same optimisation. The module's own sources are all
      // androidTest, so it is the test APK that gets minified; the library's consumer
      // rules keep what its JNI code looks up by name.
      androidTest.enableMinification = true
      testProguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "benchmark-proguard-rules.pro")
    }
  }

  // The markdown parser only. See CMakeLists.txt for why the library's own native
  // build cannot be reused here.
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  sourceSets {
    androidTest {
      assets.srcDirs += [sharedFixtures]
    }
  }
}

dependencies {
  androidTestImplementation(project(":react-native-enriched-markdown"))
  androidTestImplementation("com.facebook.react:react-android")
  androidTestImplementation("androidx.benchmark:benchmark-junit4:1.5.0")
  androidTestImplementation("androidx.test.ext:junit:1.2.1")
  androidTestImplementation("junit:junit:4.13.2")
  // The host activity needs Theme.AppCompat.Light.NoActionBar; the markdown TextView
  // requires an AppCompat theme.
  androidTestImplementation("androidx.appcompat:appcompat:1.7.0")
}

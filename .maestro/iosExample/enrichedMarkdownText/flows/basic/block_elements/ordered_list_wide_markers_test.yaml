appId: swmansion.enriched.markdown.ios.example
tags:
  - block
  - list
  - text
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

- runFlow:
    file: '../../../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: |
        1. One
        2. Two
        3. Three
        4. Four
        5. Five
        6. Six
        7. Seven
        8. Eight
        9. Nine
        10. Ten
        11. Eleven
        12. Twelve
            - Nested under a two-digit item

- runFlow:
    file: '../../../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'ordered_list_wide_markers_display'

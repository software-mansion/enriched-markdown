appId: swmansion.enriched.markdown.example
tags:
  - smoke
  - text
  - text-press
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

- runFlow:
    file: '../../../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: |
        banana

# A tap on plain text reports the character under it.
- tapOn:
    id: preview-text

- assertVisible:
    id: text-press-result
    text: 'Tapped: banana'

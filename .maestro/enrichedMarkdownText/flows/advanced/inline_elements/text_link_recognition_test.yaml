appId: swmansion.enriched.markdown.example
tags:
  - advanced
  - inline
  - link
  - text
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

- runFlow:
    file: '../../../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: |
        ref:one

        `ref:two`

        [ref:three](https://existing.invalid)

        `prefix ref:four`

- scrollUntilVisible:
    element:
      id: recognize-links-button
    direction: DOWN

# Recognition starts disabled, then runs through both native renderers.
- tapOn: ref:one
- assertNotVisible: Link

- repeat:
    times: 2
    commands:
      - tapOn:
          id: recognize-links-button
      - scrollUntilVisible:
          element:
            id: preview-container
          direction: DOWN
      - tapOn: ref:one
      - assertVisible: Link
      - assertVisible: ref:one
      - tapOn: OK
      - tapOn: ref:two
      - assertVisible: Link
      - assertVisible: ref:two
      - tapOn: OK
      - tapOn: ref:three
      - assertVisible: https://existing.invalid
      - tapOn: OK
      - tapOn: prefix ref:four
      - assertNotVisible: Link
      - scrollUntilVisible:
          element:
            id: recognize-links-button
          direction: UP

# Turning recognition off on unchanged Markdown removes generated links.
- tapOn:
    id: recognize-links-button
- tapOn: ref:one
- assertNotVisible: Link

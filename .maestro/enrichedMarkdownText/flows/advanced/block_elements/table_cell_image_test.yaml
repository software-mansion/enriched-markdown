appId: swmansion.enriched.markdown.example
tags:
  - block
  - advanced
  - image
  - table
  - text
---
# checks a block image rendered INSIDE a table cell (issue #764), not merely
# an image following the table
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

- runFlow:
    file: '../../../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: |
        | Label   | Image |
        | ------- | ----- |
        | Example | ![Example image](https://placehold.co/160x100.webp) |

- tapOn:
    id: blur-button

- runFlow:
    file: '../../../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'table_cell_image_display'

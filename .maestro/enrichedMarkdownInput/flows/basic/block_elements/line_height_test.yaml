appId: swmansion.enriched.markdown.example
tags:
  - input
  - block
  - line-height
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

# Seed heading, body and list lines, then switch to the tall line height (LH 36).
- runFlow:
    file: '../../../../enrichedMarkdownText/subflows/set_enriched_text_value.yaml'
    env:
      VALUE: |
        # Heading
        Line one of body text
        - List item alpha
        Line two of body text

- tapOn:
    id: line-height-toggle

- tapOn:
    id: blur-button

- runFlow:
    file: '../../../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'line_height_input'

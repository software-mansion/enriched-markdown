appId: swmansion.enriched.markdown.example
tags:
  - input
  - smoke
  - inline
  - link
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

# The link button sits past the right edge of the scrolling toolbar.
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: formatting-toolbar
          direction: LEFT

- tapOn:
    id: toolbar-link

- tapOn:
    id: link-modal-text-input

- inputText: 'Click here'

- tapOn:
    id: link-modal-url-input

- inputText: 'https://example.com'

- tapOn:
    id: link-modal-save

- tapOn:
    text: 'Click here'

# The playground prints the latest StyleState as JSON. Key order differs by
# platform, so check the destination and the (only) active style separately.
- assertVisible:
    id: style-state-json
    text: '.*"destination":"https://example\.com".*'

- assertVisible:
    id: style-state-json
    text: '.*"isActive":true.*'

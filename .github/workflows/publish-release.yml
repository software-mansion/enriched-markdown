name: Publish release to npm
on:
  # For nightly releases
  schedule:
    - cron: '27 23 * * *' # at 23:27 every day
  # For manual releases
  workflow_dispatch:
    inputs:
      release-type:
        description: Type of release to publish.
        type: choice
        options:
          - stable
          - nightly
          - beta
          - rc
        default: stable
      version:
        description: Specific version to publish (usually inferred from x.y-stable branch name).
        type: string
        required: false
        default: ''
      dry-run:
        description: Whether to perform a dry run of the publish.
        type: boolean
        default: true

env:
  RN_VERSION: 0.88.0
  RN_CLI_VERSION: 20.2.0
  NPM_VERSION: 11.11.0

jobs:
  packed-package-ios:
    if: github.repository == 'software-mansion/enriched-markdown'
    runs-on: macos-latest-xlarge
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Install the npm the release uses
        run: npm install -g "npm@$NPM_VERSION"

      - name: Pack the package
        working-directory: packages/react-native-enriched-markdown
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an app with the packed package
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "@react-native-community/cli@$RN_CLI_VERSION" init PackedApp \
            --version "$RN_VERSION" --skip-git-init --install-pods false --pm npm --directory PackedApp
          cd PackedApp
          npm install "$RUNNER_TEMP"/react-native-enriched-markdown-*.tgz

      - name: Check the installed package
        working-directory: ${{ runner.temp }}/PackedApp/node_modules/react-native-enriched-markdown
        run: |
          test -f lib/module/index.js
          test -f lib/typescript/src/index.d.ts
          test -f ios/vendor/.stamp
          test -f cpp/highlight/vendor/grammars/.stamp

      - name: Build the app with CocoaPods
        working-directory: ${{ runner.temp }}/PackedApp
        run: |
          (cd ios && pod install)
          xcodebuild build \
            -workspace ios/PackedApp.xcworkspace \
            -scheme PackedApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PodsDerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Build the app with Swift Package Manager
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/PackedApp
        run: |
          npx react-native spm add --deintegrate --yes
          xcodebuild build \
            -project ios/PackedApp.xcodeproj \
            -scheme PackedApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SpmDerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

  packed-package-android:
    if: github.repository == 'software-mansion/enriched-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Android
        uses: ./.github/actions/setup-android
        with:
          cache: restore

      - name: Install the npm the release uses
        run: npm install -g "npm@$NPM_VERSION"

      - name: Pack the package
        working-directory: packages/react-native-enriched-markdown
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an app with the packed package
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "@react-native-community/cli@$RN_CLI_VERSION" init PackedApp \
            --version "$RN_VERSION" --skip-git-init --pm npm --directory PackedApp
          cd PackedApp
          npm install "$RUNNER_TEMP"/react-native-enriched-markdown-*.tgz

      - name: Check the installed package
        working-directory: ${{ runner.temp }}/PackedApp/node_modules/react-native-enriched-markdown
        run: |
          test -f lib/module/index.js
          test -f lib/typescript/src/index.d.ts
          test -f ios/vendor/.stamp
          test -f cpp/highlight/vendor/grammars/.stamp

      - name: Build the app
        working-directory: ${{ runner.temp }}/PackedApp/android
        run: ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  npm-build:
    if: github.repository == 'software-mansion/enriched-markdown'
    needs:
      - packed-package-ios
      - packed-package-android
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write # for OIDC

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Holds an OIDC token, so no yarn cache: android-benchmarks can write one.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Publish manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: software-mansion/npm-package-publish@264013301cc21350186b190f1f6dd10ae4c8ee04 # 1.0.0
        with:
          package-name: 'react-native-enriched-markdown'
          package-json-path: 'packages/react-native-enriched-markdown/package.json'
          install-dependencies-command: 'YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install'
          release-type: ${{ inputs.release-type }}
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry-run }}

      - name: Publish automatic nightly release
        if: ${{ github.event_name == 'schedule' }}
        uses: software-mansion/npm-package-publish@264013301cc21350186b190f1f6dd10ae4c8ee04 # 1.0.0
        with:
          package-name: 'react-native-enriched-markdown'
          package-json-path: 'packages/react-native-enriched-markdown/package.json'
          install-dependencies-command: 'YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install'
          release-type: 'nightly'
          dry-run: false

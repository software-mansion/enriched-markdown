name: Restore highlight vendor files
description: >-
  Materializes the gitignored tree-sitter runtime, grammars and generated
  registry under packages/core/cpp/highlight/vendor; run after Setup (the
  grammars are copied from node_modules) and before any cache key or build
  that reads them.

runs:
  using: composite
  steps:
    - name: Cache tree-sitter vendor files
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: packages/core/cpp/highlight/vendor
        key: ${{ runner.os }}-highlight-vendor-${{ hashFiles('vendor/vendor-grammars.mjs', 'vendor/gen-registry.mjs', 'vendor/grammar-versions.json', 'yarn.lock') }}

    # Idempotent: the script's stamps make it a no-op on a cache hit.
    - name: Restore tree-sitter vendor files
      run: node vendor/vendor-grammars.mjs
      shell: bash
      working-directory: ${{ github.workspace }}

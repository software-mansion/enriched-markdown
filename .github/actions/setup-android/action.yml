name: Setup Android
description: Install JDK, accept Android SDK licenses, and set up Gradle with its cache

inputs:
  cache:
    description: >-
      How to use the Gradle cache: read-write, restore (restore it but never
      save it), or none
    required: false
    default: read-write

runs:
  using: composite
  steps:
    - name: Configure Android SDK
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

    - name: Install JDK
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Finalize Android SDK
      run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
      shell: bash

    - name: Check the cache mode
      if: ${{ !contains(fromJSON('["read-write", "restore", "none"]'), inputs.cache) }}
      run: |
        echo "::error::Unknown cache mode '${{ inputs.cache }}'; expected read-write, restore or none"
        exit 1
      shell: bash

    - name: Configure Gradle
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'EOF'
        org.gradle.caching=true
        org.gradle.parallel=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        EOF
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      with:
        cache-disabled: ${{ inputs.cache == 'none' }}
        cache-read-only: ${{ inputs.cache == 'restore' || github.ref != 'refs/heads/main' }}
        add-job-summary: on-failure
        validate-wrappers: false

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: npx eslint --no-warn-ignored {staged_files}
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn typecheck
    clang-format:
      glob: '*.{h,hpp,m,mm,cpp}'
      exclude:
        - '**/Pods/**'
        - '**/build/**'
        - '**/node_modules/**'
        # Vendored verbatim from software-mansion-labs/md4c by
        # scripts/fetch-md4c.sh. Formatting it here would rewrite the sync'd
        # copy on every commit and break byte-identity with the fork.
        - 'packages/core/cpp/enrmrkd/**'
      run: npx clang-format -i {staged_files}
      stage_fixed: true
    ktlint-react-native:
      glob: 'packages/react-native-enriched-markdown/android/**/*.kt'
      run: cd apps/react-native-example/android && ./gradlew :react-native-enriched-markdown:ktlintFormat --quiet
      stage_fixed: true
    ktlint-android:
      root: 'packages/enriched-markdown-android/'
      glob: 'packages/enriched-markdown-android/**/*.kt'
      run: ./gradlew ktlintFormat --quiet
      stage_fixed: true
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit

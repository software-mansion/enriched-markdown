nodeLinker: node-modules
nmHoistingLimits: workspaces

yarnPath: .yarn/releases/yarn-4.11.0.cjs

# The tree-sitter grammars are vendored from source (see vendor/vendor-grammars.mjs);
# we never load their compiled Node bindings. @tree-sitter-grammars/tree-sitter-markdown,
# tree-sitter-swift, tree-sitter-kotlin and @derekstride/tree-sitter-sql ship a typo'd
# peerDependenciesMeta key ("tree_sitter" instead of "tree-sitter"), so Yarn treats their
# optional "tree-sitter" peer as required and warns. Re-declare it optional. (Their
# native builds are disabled via dependenciesMeta in package.json.)
packageExtensions:
  '@tree-sitter-grammars/tree-sitter-markdown@*':
    peerDependenciesMeta:
      tree-sitter:
        optional: true
  '@derekstride/tree-sitter-sql@*':
    peerDependenciesMeta:
      tree-sitter:
        optional: true
  'tree-sitter-kotlin@*':
    peerDependenciesMeta:
      tree-sitter:
        optional: true
  'tree-sitter-swift@*':
    peerDependenciesMeta:
      tree-sitter:
        optional: true

# The only packages with builds disabled above are those vendored tree-sitter grammars,
# so silence the per-package "build has been explicitly disabled" notice (YN0005).
logFilters:
  - code: YN0005
    level: discard
